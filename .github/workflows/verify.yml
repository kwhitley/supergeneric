name: Verify

on:
  push:
    branches: [v4.x, main]
  pull_request:
    branches: [v4.x, main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2.0.1
      - name: Install dependencies
        run: bun install
      - name: Verify build and tests
        run: bun run verify
